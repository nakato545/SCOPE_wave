<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>実験の解説 | 東京理科大学 理科教育サークル SCOPE</title>
<link rel="icon" href="SCOPEロゴ通常版-768x768.webp" type="image/webp">

<style>
/* ===== 全体 ===== */
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
  overflow: hidden;
}

/* ===== 背景設定（固定表示） ===== */
body {
  background-color: #eef;
  background-image: url("ex.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  /* 背景の切り替えを0.5秒でなめらかにする */
  transition: background-image 0.5s ease-in-out;
}

/* アニメーション中の操作無効化用 */
.no-click {
  pointer-events: none !important;
}

/* ===== ふりがな ===== */
ruby { ruby-position: over; }
rt { font-size: 0.5em; }

/* ===== 追加：右上ホームボタン ===== */
.home-button {
  position: fixed; top: 12px; right: 12px;
  padding: 8px 20px; border: 2px solid black; border-radius: 14px;
  background: white; font-size: 16px; text-decoration: none;
  color: black; z-index: 10; font-weight: bold;
  cursor: pointer; transition: 0.2s;
}
.home-button:hover { background-color: #d0d0d0; transform: scale(1.05); }

/* ===== 中央表示（白いシート） ===== */
.container {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center;
  z-index: 1;
  
  /* 中央の白いシートの設定 */
  background-color: rgba(255, 255, 255, 0.85);
  padding: 40px 60px;
  border-radius: 30px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
  min-width: 320px;
}

/* ===== タイトル ===== */
.title { 
  font-size: 32px; 
  margin-bottom: 30px; 
  font-weight: bold; 
  color: #333;
}

/* ===== モードボタン ===== */
.mode-button {
  width: 260px; padding: 16px; margin: 12px 0;
  border: 2px solid black; border-radius: 20px;
  background-color: white; font-size: 18px; text-align: center;
  cursor: pointer; transition: 0.2s;
}
.mode-button:hover { background-color: #d0d0d0; transform: scale(1.05); }
</style>
</head>
<body>

<a href="javascript:void(0);" class="home-button" onclick="goHome()">ホーム</a>

<div class="container" id="content">
  <div class="title">
    <ruby>実験<rt>じっけん</rt></ruby>の
    <ruby>解説<rt>かいせつ</rt></ruby>
  </div>

  <div class="mode-button" onclick="location.href='pdf1.pdf'">
    <ruby>音<rt>おと</rt></ruby>を<ruby>小<rt>ちい</rt></ruby>さくしてみよう</div>

  <div class="mode-button" onclick="location.href='pdf2.pdf'">
    シャボン<ruby>液<rt>えき</rt></ruby>の<ruby>模様<rt>もよう</rt></ruby>を<ruby>見<rt>み</rt></ruby>てみよう </div>

  <div class="mode-button" onclick="location.href='pdf3.pdf'">
    <ruby>光<rt>ひかり</rt></ruby>の<ruby>波<rt>なみ</rt></ruby>のイリュージョン</div>
</div>

<script>
function goHome() {
  // 操作を無効化
  document.body.classList.add('no-click');
  
  // 背景をなめらかに変更（0.5秒）
  document.body.style.backgroundImage = "url('ex2.png')";
  
  // 1秒後（変色0.5秒 + 待機0.5秒）に遷移
  setTimeout(function() {
    window.location.href = "index.html";
  }, 1000);
}
</script>

</body>
</html>
