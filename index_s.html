<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>波の伝わり方 | 東京理科大学 理科教育サークル SCOPE</title>
<link rel="icon" href="SCOPEロゴ通常版-768x768.webp" type="image/webp">

<style>
/* ===== 全体 ===== */
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
  overflow: hidden;
}

/* ===== 背景 ===== */
body {
  background-color: #eef;
  background-image: url("background.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  transition: background-image 2s ease-in-out;
}

/* ===== 波レイヤー (追加) ===== */
#wave-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
}

.wave {
  position: absolute;
  border-radius: 50%;
  border: 2px solid rgba(100, 149, 237, 0.4);
  transform: translate(-50%, -50%);
  filter: blur(1px);
  box-shadow:
    0 0 6px rgba(100, 149, 237, 0.2),
    inset 0 0 6px rgba(100, 149, 237, 0.2);
}

/* ===== ふりがな ===== */
ruby { ruby-position: over; }
rt { font-size: 0.5em; }

/* ===== 追加：左上リンク ===== */
.top-left-link {
  position: fixed; top: 12px; left: 12px;
  padding: 8px 14px; border: 2px solid black; border-radius: 14px;
  background: white; font-size: 14px; text-decoration: none;
  color: black; z-index: 10;
}
.top-left-link:hover { background-color: #d0d0d0; }

/* ===== 中央表示 ===== */
.container {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -45%);
  display: flex; flex-direction: column; align-items: center;
  z-index: 2;
}

/* ===== タイトル ===== */
.title { font-size: 32px; margin-bottom: 40px; font-weight: bold; }

/* ===== モードボタン ===== */
.mode-button {
  width: 260px; padding: 16px; margin: 16px 0;
  border: 2px solid black; border-radius: 20px;
  background-color: white; font-size: 18px; text-align: center;
  cursor: pointer; transition: 0.2s;
}
.mode-button:hover { background-color: #d0d0d0; transform: scale(1.05); }

/* ===== フッターリンク ===== */
.footer-link {
  position: fixed; right: 12px; bottom: 12px;
  padding: 8px 14px; border: 2px solid black; border-radius: 14px;
  background: white; font-size: 12px; line-height: 1.4;
  z-index: 10;
}
.footer-link a { display: block; color: black; text-decoration: none; cursor: pointer; }
.footer-link:hover { background-color: #d0d0d0; }

/* ===== ロード画面 ===== */
#loading {
  position: fixed; inset: 0; 
  background: rgba(255,255,255,0.9); 
  backdrop-filter: blur(10px);
  display: flex; justify-content: center;
  align-items: center; z-index: 9999; transition: opacity 1s ease;
}
#loading.fade-out { opacity: 0; pointer-events: none; }

.logo-container {
  display: flex;
  align-items: center;
  justify-content: center;
}

#loading-logo {
  width: 80px;
  transition: transform 0.8s ease-in-out;
}
#loading-text {
  width: 140px; 
  opacity: 0;
  transform: translateX(-5px); 
  transition: opacity 0.8s ease-out 0.3s, transform 0.8s ease-out 0.3s;
  margin-left: 5px; 
}
.animating #loading-logo { transform: translateX(-25px); }
.animating #loading-text { opacity: 1; transform: translateX(0); }

@media (min-width: 768px) {
  #loading-logo { width: 120px; }
  #loading-text { width: 210px; margin-left: 8px; }
  .animating #loading-logo { transform: translateX(-40px); }
}

/* ===== 画面向き警告 ===== */
#orientation-warning {
  display: none;
  position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
  background: #ffffff; z-index: 10000;
  flex-direction: column; justify-content: center; align-items: center;
  text-align: center; padding: 20px; box-sizing: border-box;
  touch-action: none;
}

.rotate-icon {
  width: 44px; height: 88px;
  border: 3px solid #000; border-radius: 8px;
  position: relative; margin-bottom: 25px; background: #fff;
  transform: rotate(-90deg);
  animation: rotate-up 2s infinite ease-in-out;
  box-sizing: border-box;
}

.rotate-icon::before {
  content: ""; position: absolute; top: 0; left: 50%;
  transform: translateX(-50%); width: 18px; height: 4px;
  background: #000; border-bottom-left-radius: 3px; border-bottom-right-radius: 3px;
}

.rotate-icon::after {
  content: ""; position: absolute; bottom: 4px; left: 50%;
  transform: translateX(-50%); width: 14px; height: 2px;
  background: #000; border-radius: 1px;
}

@keyframes rotate-up {
  0% { transform: rotate(-90deg); }
  30%, 100% { transform: rotate(0deg); }
}

#orientation-warning p {
  display: flex; justify-content: center; align-items: flex-end;
  gap: 0.1em; font-weight: bold; font-size: 20px; margin: 0;
}
</style>
</head>
<body>

<div id="wave-layer"></div>

<div id="orientation-warning">
  <div class="rotate-icon"></div>
  <p><ruby>画<rt>が</rt></ruby><ruby>面<rt>めん</rt></ruby>を<ruby>縦<rt>たて</rt></ruby>にしてください</p>
</div>

<div id="loading">
  <div class="logo-container">
    <img src="SCOPEロゴ通常版-768x768.webp" alt="SCOPEロゴ" id="loading-logo">
    <img src="S.png" alt="" id="loading-text">
  </div>
</div>

<a href="index.html" class="top-left-link">
  パソコンの方はこちら
</a>

<div class="container" id="content">
  <div class="title">
    <ruby>波<rt>なみ</rt></ruby>の
    <ruby>伝<rt>つた</rt></ruby>わり
    <ruby>方<rt>かた</rt></ruby>
  </div>

  <div class="mode-button link-item" data-url="wave_s.html">
    <ruby>波<rt>なみ</rt></ruby>を<ruby>観察<rt>かんさつ</rt></ruby>する</div>

  <div class="mode-button link-item" data-url="interference_s.html">
    <ruby>波<rt>なみ</rt></ruby>の<ruby>重<rt>かさ</rt></ruby>なりを<ruby>観察<rt>かんさつ</rt></ruby>する </div>

  <div class="mode-button link-item" data-url="explanation_s.html">
    <ruby>実験<rt>じっけん</rt></ruby>の<ruby>解説<rt>かいせつ</rt></ruby></div>
</div>

<div class="footer-link">
  <a class="link-item" data-url="https://tus-scope.tokyo/" target="_blank">
    ホームページ：<br>
    東京理科大 理科教育サークル SCOPE
  </a>
</div>

<script>
function checkOrientation() {
  const warning = document.getElementById("orientation-warning");
  if (window.innerWidth > window.innerHeight) {
    warning.style.display = "flex";
  } else {
    warning.style.display = "none";
  }
}

window.addEventListener("load", () => {
  const loader = document.getElementById("loading");
  const waveLayer = document.getElementById("wave-layer");
  
  checkOrientation();

  setTimeout(() => {
    loader.classList.add("animating");
  }, 500);

  setTimeout(() => {
    loader.classList.add("fade-out");
  }, 2800);

  const images = ["background.png", "background2.png", "background3.png"];
  let currentIndex = 0;

  images.forEach(src => {
    const img = new Image();
    img.src = src;
  });

  setInterval(() => {
    currentIndex = (currentIndex + 1) % images.length;
    document.body.style.backgroundImage = `url("${images[currentIndex]}")`;
  }, 20000);

  /* ===== 波エフェクト用処理 ===== */
  const maxRipples = 15;
  const ripples = [];

  function createWave(x, y, delay, initialBorderWidth) {
    setTimeout(() => {
      const wave = document.createElement("div");
      wave.className = "wave";
      wave.style.left = x + "px";
      wave.style.top = y + "px";
      waveLayer.appendChild(wave);
      ripples.push(wave);

      if (ripples.length > maxRipples) {
        const old = ripples.shift();
        if (old) old.remove();
      }

      const duration = 2500;
      const start = performance.now();

      function animate(t) {
        const elapsed = t - start;
        const progress = elapsed / duration;
        if (progress >= 1) {
          wave.remove();
          return;
        }
        const r = 500 * Math.pow(progress, 0.8);
        wave.style.width = r * 2 + "px";
        wave.style.height = r * 2 + "px";
        const easeOut = 1 - Math.pow(progress, 2);
        wave.style.opacity = (0.5 * easeOut).toString();
        wave.style.borderWidth = (initialBorderWidth * easeOut) + "px";
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    }, delay);
  }

  document.addEventListener("click", (e) => {
    createWave(e.clientX, e.clientY, 0, 4);
    createWave(e.clientX, e.clientY, 250, 2.5);
    createWave(e.clientX, e.clientY, 500, 1.5);
  });

  /* ===== ページ遷移の待機処理 (0.2秒) ===== */
  const linkItems = document.querySelectorAll('.link-item');
  linkItems.forEach(item => {
    item.addEventListener('click', (e) => {
      e.preventDefault();
      const url = item.getAttribute('data-url');
      const target = item.getAttribute('target');
      setTimeout(() => {
        if (target === '_blank') {
          window.open(url, '_blank');
        } else {
          window.location.href = url;
        }
      }, 200);
    });
  });
});

window.addEventListener("resize", checkOrientation);
</script>
</body>
</html>
