  <style>
    :root { --scale-factor: 1; --tab-width:44px; --tab-height:100px; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #f0f2f5; font-family: -apple-system, "Helvetica Neue", "Hiragino Kaku Gothic ProN", sans-serif; position: fixed; top: 0; left: 0; overscroll-behavior: none; }
    
    #orientation-warning { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 999999; color: #000000; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; }
    .rotate-icon { width: 44px; height: 88px; border: 3px solid #000; border-radius: 8px; position: relative; margin-bottom: 25px; background: #fff; animation: rotate-anim 2s infinite ease-in-out; box-sizing: border-box; }
    .rotate-icon::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 18px; height: 4px; background: #000; border-bottom-left-radius: 3px; border-bottom-right-radius: 3px; }
    .rotate-icon::after { content: ""; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 14px; height: 2px; background: #000; border-radius: 1px; }
    #orientation-warning p { display: flex !important; justify-content: center; align-items: flex-end !important; gap: 0; font-weight: bold; font-size: 20px; margin: 0; line-height: 1.2; }
    
    #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99999; transition: opacity 1s ease; }
    .logo-container { position: relative; display: inline-block; }
    #loading img { width: 180px; height: auto; display: block; }
    .loading-text { position: absolute; right: 0; bottom: -25px; font-family: sans-serif; font-size: 14px; font-weight: bold; color: #555; letter-spacing: 1px; animation: blink 1.2s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.1; } 100% { opacity: 1; } }
    #loading.fade-out { opacity: 0; pointer-events: none; }
    
    ruby { display: inline-flex; flex-direction: column-reverse; vertical-align: bottom; line-height: 1.1; text-align: center; }
    rt { display: block; font-size: 0.55em; line-height: 1.1; margin-bottom: 2px; min-height: 1.1em; }
    rt.dummy { visibility: hidden; }
    
    #sideNav { position: fixed; top: 10px; right: 10px; z-index: 9999; display: flex; flex-direction: column; gap: 5px; }
    .nav-btn { text-decoration: none; color: black; background: white; border: 1.5px solid black; border-radius: 8px; font-size: calc(11px * var(--scale-factor)); font-weight: bold; width: calc(75px * var(--scale-factor)); height: calc(45px * var(--scale-factor)); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .nav-btn.active { background: #e9e5ff; border-color: #0000ff; }
    
    #contentContainer { display: flex; flex-direction: column; align-items: center; justify-content: space-between; width: 100%; height: 100vh; height: 100dvh; padding: 10px; padding-bottom: env(safe-area-inset-bottom, 10px); box-sizing: border-box; }
    #canvasWrapper { position: relative; width: 100%; max-width: 900px; flex-grow: 1; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    #canvas { display:block; background:white; border-bottom: 2px solid #ccc; touch-action: none; width: 100%; height: 100%; }
    
    #mainPanel { position: relative; width: 100%; max-width: 700px; height: auto; background: rgba(255,255,255,0.98); border: 2px solid black; border-radius: 15px; display: flex; flex-wrap: wrap; padding: calc(8px * var(--scale-factor)); gap: 6px; z-index: 100; box-shadow: 0 5px 20px rgba(0,0,0,0.15); box-sizing: border-box; align-items: center; margin-bottom: 5px; }
    
    .setting-panel { position: absolute; bottom: 115%; left: 50%; transform: translateX(-50%); width: 96%; max-width: calc(420px * var(--scale-factor)); background: white; border: 2px solid black; border-radius: 15px; padding: 12px; z-index: 90; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: none; flex-direction: column; gap: 10px; box-sizing: border-box; }
    .ui-row { display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; }
    .label-box { width: 60px; font-size: 12px; font-weight: bold; color: #444; flex-shrink: 0; text-align: left; }
    .btn-pair { display: flex; gap: 5px; flex: 1; height: calc(48px * var(--scale-factor)); box-sizing: border-box; }
    .btn-pair .ui-btn { flex: 1; flex-basis: 0; white-space: nowrap; }
    .ui-btn { border: 1.5px solid black; border-radius: 10px; background: white; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; font-weight: bold; width: 100%; height: 100%; }
    .ui-btn.active { background: #e9e5ff !important; border-color: #0000ff; }
    .main-btn { height: calc(52px * var(--scale-factor)); }
    
    #manualText, #sliderArea { min-height: calc(50px * var(--scale-factor)); max-height: calc(50px * var(--scale-factor)); overflow: hidden; box-sizing: border-box; }
    #manualText { font-size: 12px; color: #333; text-align: center; border: 1.5px dashed #bbb; padding: 6px; border-radius: 10px; background: #fafafa; display: flex; align-items: center; justify-content: center; }
    
    #playGuide { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 2000; pointer-events: none; background: rgba(0, 0, 0, 0.7); color: white; padding: 12px 24px; border-radius: 30px; font-weight: bold; opacity: 0; transition: opacity 0.3s ease; }
    #playGuide.show { opacity: 1; }
    
    .slider-group { flex: 1; }
    .slider-info { display: flex; justify-content: space-between; font-weight: bold; font-size: 10px; margin-bottom: 1px; }
    .val-display { font-family: monospace; font-size: 12px; color: #0000ff; }
    input[type="range"] { width: 100%; height: 18px; cursor: pointer; }
    
    .trapezoid-tab { position: absolute; left: 100%; width: var(--tab-width); height: var(--tab-height); cursor: pointer; z-index: 5001; display: flex; align-items: center; justify-content: center; transition: filter 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), opacity 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); opacity: 1; pointer-events: auto; touch-action: none; }
    .trapezoid-tab.hidden { opacity: 0; pointer-events: none; }
    .trapezoid-tab-text { writing-mode: vertical-rl; font-size: 11px; font-weight: bold; color: #000; letter-spacing: 2px; pointer-events: none; position: absolute; white-space: nowrap; }
    #panel-howto .trapezoid-tab { top: 50%; transform: translateY(-50%); }
    
    .slide-panel { position: absolute; top: 0; left: 0; width: 450px; height: 100%; background: #fff; z-index: 5000; transform: translateX(-100%); transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); box-shadow: 5px 0 15px rgba(0,0,0,0.1); padding: 8px; box-sizing: border-box; border-right: 2px solid #000; display: flex; flex-direction: column; touch-action: none; }
    .slide-panel.open { transform: translateX(0); }
    
    .panel-header { position: relative; width: 100%; height: 38px; margin-bottom: 8px; flex-shrink: 0; padding: 0 4px; box-sizing: border-box; }
    .download-btn { position: absolute; top: 2px; left: 4px; right: 4px; width: calc(100% - 8px); background-color: #ffffff !important; color: #000 !important; border: 2px solid #000 !important; font-weight: bold; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; transition: transform 0.1s, background-color 0.1s; min-height: auto; height: 32px; line-height: 20px; touch-action: none; box-sizing: border-box; }
    .download-btn:active { transform: scale(0.96); background-color: #f1f5f9 !important; }
    
    .pdf-wrapper { flex: 1; display: flex; gap: 4px; min-height: 0; position: relative; }
    .pdf-container { flex: 1; overflow-y: scroll; overflow-x: hidden; background: #f5f5f5; border: 1px solid #ddd; border-radius: 8px; margin: 0; padding: 0; box-sizing: border-box; min-height: 0; width: 100%; position: relative; touch-action: none; }
    .pdf-image { width: 100%; height: auto; display: block; border-radius: 8px; -webkit-user-select: none; user-select: none; zoom: 100% !important; max-width: 100%; max-height: none; pointer-events: auto; touch-action: none; -webkit-user-drag: none; }
    
    .scroll-bar { width: 16px; background: #e0e0e0; border-radius: 8px; border: 1px solid #ccc; position: relative; flex-shrink: 0; touch-action: none; }
    .scroll-thumb { position: absolute; left: 2px; right: 2px; background: #888; border-radius: 6px; cursor: grab; touch-action: none; }
    .scroll-thumb:active { background: #555; cursor: grabbing; }
    
    .pdf-footer { margin-top: 8px; display: flex; gap: 6px; flex-shrink: 0; }
    .pdf-page-btn { flex: 1; background-color: #ffffff !important; color: #000 !important; border: 2px solid #000 !important; font-weight: bold; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; min-height: auto; height: 32px; line-height: 20px; transition: transform 0.1s, background-color 0.1s; touch-action: none; }
    .pdf-page-btn:active { transform: scale(0.96); background-color: #f1f5f9 !important; }
    .pdf-page-btn.active { background-color: #e9e5ff !important; }
    
    @keyframes rotate-anim { 0% { transform: rotate(0deg); } 30%, 100% { transform: rotate(-90deg); } }
  </style>
</head>

  <script>
    // ========== 画面向き判定 ==========
    const orientWarning = document.getElementById("orientation-warning");
    function checkOrientation() {
      const isLandscape = window.innerWidth > window.innerHeight;
      orientWarning.style.display = isLandscape ? "none" : "flex";
    }

    // ========== PDF機能 ==========
    let currentPdfPage = 1;
    function switchPdfPage(page) {
      if (currentPdfPage === page) return;
      currentPdfPage = page;
      const img = document.getElementById('pdf-image');
      const page1Btn = document.getElementById('pdf-page1-btn');
      const page2Btn = document.getElementById('pdf-page2-btn');
      if (page === 1) {
        img.src = './wave1.png';
        page1Btn.classList.add('active');
        page2Btn.classList.remove('active');
      } else if (page === 2) {
        img.src = './wave2.png';
        page2Btn.classList.add('active');
        page1Btn.classList.remove('active');
      }
      document.getElementById('pdf-zoom-area').scrollTop = 0;
      updateScrollBar();
    }
    function downloadPDF() {
      const a = document.createElement('a');
      a.href = './wave.pdf';
      a.download = 'wave.pdf';
      a.click();
    }
    function toggleSlidePanel(type) {
      const panel = document.getElementById('panel-howto');
      const isOpen = panel.classList.contains('open');
      if (!isOpen) {
        panel.classList.add('open');
      } else {
        panel.classList.remove('open');
      }
      updateTabColors();
      setTimeout(updateScrollBar, 400);
    }
    function updateTabColors() {
      const panel = document.getElementById('panel-howto');
      const tabPolygon = panel.querySelector('.trapezoid-polygon');
      if (tabPolygon) {
        tabPolygon.setAttribute('fill', panel.classList.contains('open') ? '#e9e5ff' : '#e2e8f0');
      }
    }

    // ========== カスタムスクロールバー ==========
    const pdfContainer = document.getElementById('pdf-zoom-area');
    const scrollBar = document.getElementById('scroll-bar');
    const scrollThumb = document.getElementById('scroll-thumb');
    let isDraggingThumb = false;
    let thumbStartY = 0;
    let containerScrollTop = 0;
    
    function updateScrollBar() {
      const scrollHeight = pdfContainer.scrollHeight;
      const clientHeight = pdfContainer.clientHeight;
      if (scrollHeight <= clientHeight) {
        scrollThumb.style.display = 'none';
        return;
      }
      scrollThumb.style.display = 'block';
      const scrollPercentage = pdfContainer.scrollTop / (scrollHeight - clientHeight);
      const barHeight = scrollBar.clientHeight;
      const thumbHeight = Math.max(40, (clientHeight / scrollHeight) * barHeight);
      const thumbTop = scrollPercentage * (barHeight - thumbHeight);
      scrollThumb.style.height = thumbHeight + 'px';
      scrollThumb.style.top = thumbTop + 'px';
    }
    
    pdfContainer.addEventListener('scroll', updateScrollBar, { passive: true });
    scrollThumb.addEventListener('mousedown', (e) => {
      isDraggingThumb = true;
      thumbStartY = e.clientY;
      containerScrollTop = pdfContainer.scrollTop;
      e.preventDefault();
    });
    scrollThumb.addEventListener('touchstart', (e) => {
      isDraggingThumb = true;
      thumbStartY = e.touches[0].clientY;
      containerScrollTop = pdfContainer.scrollTop;
      e.preventDefault();
    }, { passive: false });
    
    document.addEventListener('mousemove', (e) => {
      if (!isDraggingThumb) return;
      const deltaY = e.clientY - thumbStartY;
      const barHeight = scrollBar.clientHeight;
      const thumbHeight = scrollThumb.clientHeight;
      const scrollableBarHeight = barHeight - thumbHeight;
      const scrollHeight = pdfContainer.scrollHeight;
      const clientHeight = pdfContainer.clientHeight;
      const maxScroll = scrollHeight - clientHeight;
      const newScroll = containerScrollTop + (deltaY / scrollableBarHeight) * maxScroll;
      pdfContainer.scrollTop = Math.max(0, Math.min(newScroll, maxScroll));
    });
    
    document.addEventListener('touchmove', (e) => {
      if (!isDraggingThumb) return;
      const deltaY = e.touches[0].clientY - thumbStartY;
      const barHeight = scrollBar.clientHeight;
      const thumbHeight = scrollThumb.clientHeight;
      const scrollableBarHeight = barHeight - thumbHeight;
      const scrollHeight = pdfContainer.scrollHeight;
      const clientHeight = pdfContainer.clientHeight;
      const maxScroll = scrollHeight - clientHeight;
      const newScroll = containerScrollTop + (deltaY / scrollableBarHeight) * maxScroll;
      pdfContainer.scrollTop = Math.max(0, Math.min(newScroll, maxScroll));
    }, { passive: false });
    
    document.addEventListener('mouseup', () => { isDraggingThumb = false; });
    document.addEventListener('touchend', () => { isDraggingThumb = false; });

    // ========== レイアウトスケール ==========
    function adjustLayoutScale() {
      const vh = window.innerHeight;
      const baseHeight = 520;
      const scale = Math.min(1.2, Math.max(0.7, vh / baseHeight));
      document.documentElement.style.setProperty('--scale-factor', scale);
      resizeCanvas();
    }

    // ========== イベントリスナー ==========
    window.addEventListener('load', () => {
      checkOrientation();
      adjustLayoutScale();
      setTimeout(updateScrollBar, 100);
      updateTabColors();
      setTimeout(() => { document.getElementById("loading").classList.add("fade-out"); }, 800);
    });
    window.addEventListener("resize", () => {
      checkOrientation();
      adjustLayoutScale();
    });

    // ========== 波シミュレーション ==========
    let guideTimer = null;
    function triggerPlayGuide() {
      if (playing) return;
      const guide = document.getElementById("playGuide");
      guide.classList.add("show");
      if (guideTimer) clearTimeout(guideTimer);
      guideTimer = setTimeout(() => { guide.classList.remove("show"); guideTimer = null; }, 2500);
    }

    function toggleTypePanel() {
      const panel = document.getElementById("typePanel"), btn = document.getElementById("btnOpenType");
      document.getElementById("detailPanel").style.display = "none";
      document.getElementById("btnOpenDetail").classList.remove("active");
      const isOpen = (panel.style.display === "flex");
      panel.style.display = isOpen ? "none" : "flex";
      btn.classList.toggle("active", !isOpen);
    }
    function toggleDetail() {
      const panel = document.getElementById("detailPanel"), btn = document.getElementById("btnOpenDetail");
      document.getElementById("typePanel").style.display = "none";
      document.getElementById("btnOpenType").classList.remove("active");
      const isOpen = (panel.style.display === "flex");
      panel.style.display = isOpen ? "none" : "flex";
      btn.classList.toggle("active", !isOpen);
    }

    function updateManualText() {
      const target = document.getElementById("manualText");
      const colorText = (waveType === "trans") ? `<ruby>赤<rt>あか</rt></ruby><ruby>い<rt class="dummy"></rt></ruby>` : `<ruby>青<rt>あお</rt></ruby><ruby>い<rt class="dummy"></rt></ruby>`;
      target.innerHTML = `${colorText} <ruby>点<rt>てん</rt></ruby> <ruby>を<rt class="dummy"></rt></ruby> <ruby>動<rt>うご</rt></ruby> <ruby>か<rt class="dummy"></rt></ruby> <ruby>し<rt class="dummy"></rt></ruby> <ruby>て<rt class="dummy"></rt></ruby> <ruby>波<rt>なみ</rt></ruby> <ruby>を<rt class="dummy"></rt></ruby> <ruby>作<rt>つく</rt></ruby> <ruby>ろ<rt class="dummy"></rt></ruby> <ruby>う<rt class="dummy"></rt></ruby> <ruby>！<rt class="dummy"></rt></ruby>`;
    }

    const imgSky = new Image(); imgSky.src = "sky.png";
    const imgSea = new Image(); imgSea.src = "sea.png";
    const imgMusical = new Image(); imgMusical.src = "musical.png";
    const imgPlay = new Image(); imgPlay.src = "play.png";
    const imgNote = new Image(); imgNote.src = "note.png";

    const SKY_IMG_HEIGHT = 500, SEA_IMG_HEIGHT = 500, MUSICAL_IMG_HEIGHT = 400, BG_X_OFFSET = 15;
    let showBackground = true, driveType = "manual", playing = true;
    const canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d");
    const ampSlider = document.getElementById("ampSlider"), freqSlider = document.getElementById("freqSlider");
    const ampDisplay = document.getElementById("ampDisplay"), freqDisplay = document.getElementById("freqDisplay");

    let waveType = "trans", endType = "fixed", margin = 70, marginRight = 110, N = 240, y = new Array(N).fill(0), v = new Array(N).fill(0), dragging = false;
    const damping = 0.998, c = 2.0;

    let currentSpeedScale = 1.0, theta = 0, currentAmp = 40, currentFreq = 1.0, currentOmega = 2*Math.PI*currentFreq;
    let pendingAmp = 40, pendingFreq = 1.0, hasPending = false;
    let speedRamp = { active:false, start:1.0, end:1.0, elapsed:0, duration:0.35 };
    let ampRamp = { active:false, startAmp:40, endAmp:40, progress:0, durationSec:1 };
    let accel = { active:false, targetOmega:currentOmega, accelValue:0, timeLeft:0 };
    let driverTarget = 0, manualInertiaVel = 0, manualRawTarget = 0, manualFilteredTarget = 0;
    const manualTau = 0.015;
    let noteFade = 0.0;

    function lerp(a,b,t){ return a + (b-a)*t; }
    function smoothstep(t){ return t<=0?0:t>=1?1:t*t*(3-2*t); }
    function getLimit() { return Math.max(10, Math.min(60, (canvas.height / 2) - 20)); }

    function resizeCanvas(){ 
      const wrapper = document.getElementById("canvasWrapper"); 
      if (!wrapper) return; 
      canvas.width = wrapper.clientWidth; 
      canvas.height = wrapper.clientHeight; 
    }

    function resetWave(){ y.fill(0); v.fill(0); theta = 0; currentAmp = pendingAmp = parseFloat(ampSlider.value); currentFreq = pendingFreq = parseFloat(freqSlider.value); currentOmega = 2*Math.PI*currentFreq; ampRamp.active = false; hasPending = false; accel.active = false; driverTarget = 0; manualInertiaVel = 0; manualRawTarget = y[0]; manualFilteredTarget = y[0]; noteFade = 0; }

    function toggleTheoryBackground() { showBackground = !showBackground; document.getElementById("btnTheory").classList.toggle("active", showBackground); }

    function setWaveType(type){ waveType = type; resetWave(); document.getElementById("btnTrans").classList.toggle("active", type==="trans"); document.getElementById("btnLong").classList.toggle("active", type==="long"); updateManualText(); }
    function setDrive(type){ if(type === "manual" && driveType === "auto") manualInertiaVel = currentAmp * currentOmega * Math.cos(theta); else manualInertiaVel = 0; manualRawTarget = y[0]; manualFilteredTarget = y[0]; driverTarget = y[0]; driveType = type; document.getElementById("btnManual").classList.toggle("active", type==="manual"); document.getElementById("btnAuto").classList.toggle("active", type==="auto"); const sa = document.getElementById("sliderArea"), mt = document.getElementById("manualText"); if(type === "manual") { sa.style.display = "none"; mt.style.display = "flex"; } else { sa.style.display = "block"; mt.style.display = "none"; } updateManualText(); }
    function setEnd(type){ endType = type; document.getElementById("btnFixedEnd").classList.toggle("active", type==="fixed"); document.getElementById("btnFreeEnd").classList.toggle("active", type==="free"); }

    window.addEventListener("resize", () => { dragging = false; });
    window.addEventListener("orientationchange", () => { dragging = false; });
    window.addEventListener("touchcancel", () => { dragging = false; });
    window.addEventListener("touchend", () => { dragging = false; });

    function handlePointer(e) { 
      const typePanel = document.getElementById("typePanel");
      const detailPanel = document.getElementById("detailPanel");
      if (typePanel.style.display === "flex") toggleTypePanel();
      if (detailPanel.style.display === "flex") toggleDetail();

      if(driveType !== "manual") return;
      if(!playing) triggerPlayGuide();
      const rect = canvas.getBoundingClientRect();
      const clientX = (e.touches ? e.touches[0].clientX : e.clientX), clientY = (e.touches ? e.touches[0].clientY : e.clientY);

      if (
        clientY - rect.top < -canvas.height/2 ||
        clientY - rect.top > canvas.height * 1.5 ||
        clientX - rect.left < -canvas.width/2 ||
        clientX - rect.left > canvas.width * 1.5
      ) return;

      const cx = clientX - rect.left, cy = clientY - rect.top;
      const limit = getLimit();
      if (waveType === "trans") { manualRawTarget = Math.max(-limit, Math.min(limit, cy - canvas.height/2)); }
      else { manualRawTarget = Math.max(-limit, Math.min(limit, cx - margin)); }
    }

    canvas.addEventListener("mousedown", e => { dragging = true; handlePointer(e); manualFilteredTarget = manualRawTarget; manualInertiaVel = 0; });
    window.addEventListener("mousemove", e => { if(dragging) handlePointer(e); });
    window.addEventListener("mouseup", () => dragging = false);
    canvas.addEventListener("touchstart", e => { e.preventDefault(); dragging = true; handlePointer(e); manualFilteredTarget = manualRawTarget; manualInertiaVel = 0; }, {passive:false});
    canvas.addEventListener("touchmove", e => { e.preventDefault(); if(dragging) handlePointer(e); }, {passive:false});
    canvas.addEventListener("touchend", () => dragging = false);

    ampSlider.oninput = ()=>{ ampDisplay.textContent = ampSlider.value; pendingAmp = parseFloat(ampSlider.value); hasPending = true; };
    freqSlider.oninput = ()=>{ freqDisplay.textContent = Number(freqSlider.value).toFixed(2); pendingFreq = parseFloat(freqSlider.value); hasPending = true; };

    function togglePlayPause(){ playing = !playing; document.getElementById("btnPlayPause").classList.toggle("active", playing); if(playing) { document.getElementById("playGuide").classList.remove("show"); if(guideTimer) { clearTimeout(guideTimer); guideTimer = null; } } }
    function toggleSlow(){ let isSlow = (speedRamp.active ? speedRamp.end < 1.0 : currentSpeedScale < 1.0); document.getElementById("btnSlow").classList.toggle("active", !isSlow); speedRamp = { active:true, start:currentSpeedScale, end:isSlow?1.0:0.25, elapsed:0, duration:0.35 }; }

    function update(){
      if(!playing) return;
      const frameBaseSec = 0.016;
      if(speedRamp.active){ speedRamp.elapsed += frameBaseSec; let tr = Math.min(1, speedRamp.elapsed / speedRamp.duration); currentSpeedScale = lerp(speedRamp.start, speedRamp.end, smoothstep(tr)); if(tr >= 1){ currentSpeedScale = speedRamp.end; speedRamp.active = false; } }
      const deltaRealSec = frameBaseSec * currentSpeedScale;
      if(accel.active){ if(deltaRealSec >= accel.timeLeft){ currentOmega = accel.targetOmega; accel.active = false; } else { currentOmega += accel.accelValue * deltaRealSec; accel.timeLeft -= deltaRealSec; } }
      theta += currentOmega * deltaRealSec;
      if(hasPending){ const newOmega = 2*Math.PI*pendingFreq; const accelDuration = 1 / pendingFreq; accel = { active:true, targetOmega:newOmega, timeLeft:accelDuration, accelValue:(newOmega - currentOmega) / accelDuration }; ampRamp = { active:true, startAmp:currentAmp, endAmp:pendingAmp, progress:0, durationSec:1 }; hasPending = false; }
      if(ampRamp.active){ ampRamp.progress += deltaRealSec / ampRamp.durationSec; currentAmp = lerp(ampRamp.startAmp, ampRamp.endAmp, smoothstep(Math.min(1, ampRamp.progress))); if(ampRamp.progress >= 1) ampRamp.active = false; }
      if(driveType === "auto") { const limit = getLimit(); let target = (currentAmp / 60) * limit * Math.sin(theta); driverTarget += (target - driverTarget) * (1 - Math.exp(-deltaRealSec / 0.04)); }
      else if(dragging){ manualFilteredTarget += (manualRawTarget - manualFilteredTarget) * (1 - Math.exp(-deltaRealSec / manualTau)); driverTarget = manualFilteredTarget; }
      else { if (Math.abs(driverTarget) > 0.01 || Math.abs(manualInertiaVel) > 0.1) { manualInertiaVel += (-150 * driverTarget) * deltaRealSec; manualInertiaVel *= Math.pow(0.45, deltaRealSec * 60); driverTarget += manualInertiaVel * deltaRealSec; } else { driverTarget = 0; } }
      y[0] = driverTarget;
      const phDt = 0.5 * currentSpeedScale;
      for(let i=1;i<N-1;i++){ v[i] += c*c*(y[i+1] + y[i-1] - 2*y[i]) * phDt; v[i] *= damping; }
      for(let i=1;i<N-1;i++) y[i] += v[i] * phDt;
      if(endType === "fixed"){ y[N-1] = 0; v[N-1] = 0; } else { y[N-1] = y[N-2]; v[N-1] = v[N-2]; }
      const isMoving = Math.abs(y[0]) > 0.5 || (driveType === "auto" && playing);
      if (isMoving) { noteFade = Math.min(1.0, noteFade + 0.05); } else { noteFade = Math.max(0.0, noteFade - 0.03); }
    }

    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const waveAreaWidth = canvas.width - margin - marginRight, centerY = canvas.height / 2, limit = getLimit();

      if (waveType === "trans") {
        if (showBackground) {
          const bgX = margin + BG_X_OFFSET, bgW = waveAreaWidth - BG_X_OFFSET;
          ctx.save(); ctx.beginPath(); ctx.moveTo(bgX, canvas.height);
          for(let i=0; i<N; i++){ let px = margin + i * waveAreaWidth / (N-1); if(px >= bgX) ctx.lineTo(px, centerY + y[i]); }
          ctx.lineTo(margin + waveAreaWidth, canvas.height); ctx.clip();
          ctx.drawImage(imgSea, bgX, (centerY - SEA_IMG_HEIGHT/2) -50, bgW, SEA_IMG_HEIGHT); ctx.restore();
          ctx.save(); ctx.beginPath(); ctx.moveTo(bgX, 0);
          for(let i=0; i<N; i++){ let px = margin + i * waveAreaWidth / (N-1); if(px >= bgX) ctx.lineTo(px, centerY + y[i]); }
          ctx.lineTo(margin + waveAreaWidth, 0); ctx.clip();
          ctx.drawImage(imgSky, bgX, (centerY - SKY_IMG_HEIGHT/2) +25, bgW, SKY_IMG_HEIGHT); ctx.restore();
        }
        ctx.strokeStyle = "#ccc"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(margin, centerY - limit); ctx.lineTo(margin, centerY + limit); ctx.stroke();
        ctx.strokeStyle = "black"; ctx.lineWidth = 2; ctx.beginPath(); for(let i=0;i<N;i++) ctx.lineTo(margin + i*waveAreaWidth/(N-1), centerY + y[i]); ctx.stroke();
        ctx.fillStyle = "red"; ctx.beginPath(); ctx.arc(margin, centerY + y[0], 6, 0, Math.PI*2); ctx.fill();
        if(endType === "fixed"){ ctx.fillStyle = "#aaa"; ctx.fillRect(margin + waveAreaWidth, centerY - limit - 20, 4, (limit * 2) + 40); }
      } else {
        const h = 24, sliceW = waveAreaWidth / (N - 1);
        ctx.strokeStyle = "#ccc"; ctx.lineWidth = 1; ctx.beginPath(); 
        ctx.moveTo(margin - limit, centerY); ctx.lineTo(margin + limit, centerY);
        ctx.stroke();
        if (showBackground) {
          ctx.save(); ctx.globalAlpha = 0.5;
          const safeZone = 110, targetX = margin + safeZone, targetW = waveAreaWidth - safeZone, targetY = centerY - MUSICAL_IMG_HEIGHT / 2;
          if (targetW > 20) {
            ctx.beginPath(); ctx.rect(targetX, targetY, targetW, MUSICAL_IMG_HEIGHT); ctx.clip();
            const imgAspect = (imgMusical.width || 100) / (imgMusical.height || 100);
            let dW = targetW, dH = targetW / imgAspect; if (dH < MUSICAL_IMG_HEIGHT) { dH = MUSICAL_IMG_HEIGHT; dW = dH * imgAspect; }
            ctx.drawImage(imgMusical, targetX + (targetW - dW)/2, targetY + (MUSICAL_IMG_HEIGHT - dH)/2, dW, dH);
          }
          ctx.restore();
          if (waveAreaWidth > 200) {
            ctx.drawImage(imgPlay, margin + safeZone + 20, centerY + 40, 150, 150);
            if (noteFade > 0) { ctx.save(); ctx.globalAlpha = (0.55 + 0.15 * Math.sin(Date.now() / 250)) * noteFade; ctx.drawImage(imgNote, margin + safeZone + 180, centerY + 50, 130, 130); ctx.restore(); }
          }
        }
        for (let i = 0; i < N - 1; i++) {
          const dx = ((i + 1) * sliceW + y[i + 1]) - (i * sliceW + y[i]), compression = sliceW / dx;
          let gray, alpha; if (compression >= 1.0) { let weight = Math.min(1.0, (compression - 1.0) * 3.0); gray = Math.floor(180 - weight * 100); alpha = weight * 0.35; } else { let weight = Math.min(1.0, (1.0 - compression) * 3.0); gray = Math.floor(230 + weight * 25); alpha = weight * 0.15; }
          ctx.fillStyle = `rgba(${gray}, ${gray}, ${gray}, ${alpha})`; ctx.fillRect(margin + i * sliceW + y[i], centerY - h/2, (sliceW + (y[i+1]-y[i])) + 1, h);
        }
        ctx.fillStyle = "#112244"; for (let i = 0; i < N; i += 2) { const px = margin + i * waveAreaWidth / (N - 1) + y[i]; ctx.beginPath(); ctx.arc(px, centerY, 2.5, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = "#007bff"; ctx.beginPath(); ctx.arc(margin + y[0], centerY, 9, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.stroke();
        if(endType === "fixed"){ ctx.fillStyle = "#aaa"; ctx.fillRect(margin + waveAreaWidth, centerY - 40, 4, 80); }
      }
    }

    function loop(){ update(); draw(); requestAnimationFrame(loop); }
    updateManualText(); resetWave(); requestAnimationFrame(loop);
  </script>
</body>
